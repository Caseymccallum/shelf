<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save this page to Shelf</title>
    <!-- WXT turns this title into `action.default_title` - the toolbar tooltip - so it is written as
         the sentence a person should read when they hover, not the name of the extension. -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="popup">
      <header class="head">
        <h1>Shelf</h1>
        <p class="muted">Save this page. Find it forever.</p>
      </header>

      <button id="save" class="primary" type="button" autofocus>Save this page</button>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <footer class="foot">
        <p id="summary" class="muted"></p>
        <button id="open-library" class="quiet" type="button">Open library</button>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
