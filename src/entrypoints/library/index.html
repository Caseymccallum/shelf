<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shelf — your library</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="library">
      <header class="head">
        <div>
          <h1>Your shelf</h1>
          <p id="stats" class="muted"></p>
        </div>
        <div class="head-actions">
          <button id="export" class="quiet" type="button">Export</button>
          <button id="import" class="quiet" type="button">Import</button>
          <button id="refresh" class="quiet" type="button">Refresh</button>
        </div>
      </header>

      <p id="transfer" class="muted" role="status" aria-live="polite"></p>

      <input
        id="query"
        class="search-input"
        type="search"
        placeholder="Search everything you have saved"
        aria-label="Search everything you have saved"
        autocomplete="off"
        autofocus
      />

      <p id="note" class="muted" role="status" aria-live="polite"></p>
      <ul id="results" class="results"></ul>

      <input id="import-file" class="visually-hidden" type="file" accept="application/json,.json" />
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
